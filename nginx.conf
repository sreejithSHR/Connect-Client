server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets never change: cache for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/room/:id, /stream/:id, ...) all serve the SPA.
    # index.html itself is never cached, so a deploy shows up on next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
